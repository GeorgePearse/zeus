name: Python Checks

on:
  push:
    branches: [dev, main]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - '.pre-commit-config.yaml'
      - '.github/workflows/python-checks.yml'
  pull_request:
    branches: [dev, main]
    paths:
      - '**.py'
      - 'pyproject.toml'
      - '.pre-commit-config.yaml'
      - '.github/workflows/python-checks.yml'

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv pip install --system prek zuban

      - name: Run prek hooks
        run: prek run --all-files

      - name: Run zuban type checking
        run: zuban check
