name: zeus

on:
  issue_comment:
    types: [created]

jobs:
  zeus:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      contains(github.event.comment.body, ' /zeus')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run zeus
        uses: sst/zeus/github@latest
        env:
          ZEUS_API_KEY: ${{ secrets.ZEUS_API_KEY }}
        with:
          model: zeus/sonic
