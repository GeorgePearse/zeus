[project]
name = "zeus-tooling"
version = "0.1.0"
description = "Python tooling and utilities for Zeus development"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "prek>=0.2.10",
    "zuban>=0.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[tool.prek]
# Prek configuration - uses .pre-commit-config.yaml for hook definitions

[tool.zuban]
# Zuban type checking configuration
strict = true
python_version = "3.11"
